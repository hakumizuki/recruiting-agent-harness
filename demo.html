<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* デモ専用ページ。本体（scene.html）を iframe で表示し、上の帯の「次へ」でボタン操作を代わりに行う */
:root { --fg: #1d2330; --muted: #6b7384; --accent: #7a4fd0; --bg: #f5f6f8; --red: #c62f2f; --green: #17845a; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font-family: "Noto Sans JP", system-ui, sans-serif; }
#bar { background: var(--fg); color: #fff; padding: 14px 22px; display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; }
#count { font-weight: 700; font-size: 14px; background: #fff; color: var(--fg); border-radius: 8px; padding: 4px 12px; white-space: nowrap; }
#title { font-size: 22px; font-weight: 700; line-height: 1.35; }
#say { font-size: 15px; opacity: .85; margin-top: 2px; line-height: 1.55; }
#say b { color: #ffd479; }
.ctrl { display: flex; gap: 8px; align-items: center; }
.ctrl button { border: 0; border-radius: 10px; padding: 12px 22px; font: inherit; font-weight: 700; cursor: pointer; }
#next { background: #fff; color: var(--fg); font-size: 17px; min-width: 150px; }
#next:disabled { opacity: .45; cursor: default; }
#restart, #lang { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4) !important; font-size: 13px; padding: 8px 12px !important; }
#busy { font-size: 13px; color: #ffd479; min-height: 18px; }
#progress { height: 4px; background: rgba(255,255,255,.15); grid-column: 1 / -1; border-radius: 2px; overflow: hidden; }
#progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
iframe { flex: 1; border: 0; width: 100%; background: #fff; }
#stage { flex: 1; position: relative; display: flex; min-height: 0; }
#intro { position: absolute; inset: 0; background: var(--bg); overflow-y: auto; display: flex; justify-content: center; padding: 28px 20px; z-index: 2; }
#intro[hidden] { display: none; }
.intro-wrap { max-width: 1080px; width: 100%; display: grid; gap: 18px; align-content: start; }
.intro-wrap h2 { margin: 0; font-size: 30px; line-height: 1.3; text-wrap: balance; }
.intro-wrap .lead { margin: 0; font-size: 17px; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 900px) { .cards { grid-template-columns: 1fr; } }
.card { background: #fff; border: 1px solid #e3e6eb; border-radius: 14px; padding: 18px; display: grid; gap: 10px; align-content: start; }
.card .k { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--accent); text-transform: uppercase; }
.card h3 { margin: 0; font-size: 19px; }
.card p, .card li { margin: 0; font-size: 15px; line-height: 1.6; }
.card ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.big { font-size: 34px; font-weight: 700; line-height: 1.1; }
.big small { font-size: 14px; font-weight: 500; color: var(--muted); display: block; margin-top: 2px; }
.flow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
.flow span { background: #f0eafc; color: #5a33b0; border-radius: 8px; padding: 4px 10px; font-weight: 700; }
.flow i { font-style: normal; color: var(--muted); }
.tech { display: flex; flex-wrap: wrap; gap: 6px; }
.tech span { border: 1px solid #e3e6eb; border-radius: 99px; padding: 2px 10px; font-size: 13px; background: #fafbfc; }
@media (max-width: 800px) { #bar { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="bar">
  <div id="count">0 / 0</div>
  <div><div id="title"></div><div id="say"></div><div id="busy"></div></div>
  <div class="ctrl">
    <button id="lang">日本語</button>
    <button id="restart">Restart</button>
    <button id="next">Start ▶</button>
  </div>
  <div id="progress"><i id="bar-fill" style="width:0"></i></div>
</div>
<div id="stage">
  <div id="intro"><div class="intro-wrap" id="intro-body"></div></div>
  <iframe id="app"></iframe>
</div>

<script>
let lang = location.hash === "#ja" ? "ja" : "en";
const $ = (id) => document.getElementById(id);
const doc = () => $("app").contentDocument;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- 本体の画面を操作する小道具（本体のコードには触れない）
const click = (sel) => { const el = doc().querySelector(sel); if (el) el.click(); return !!el; };
async function waitFor(fn, ms = 20000) { const t0 = Date.now(); while (Date.now() - t0 < ms) { try { if (fn()) return true; } catch (e) {} await sleep(200); } return false; }
async function newDayReady() { await sleep(400); await waitFor(() => doc().querySelectorAll(".ebtn").length > 0); await sleep(600); }
async function sendMsg(index) {
  const before = doc().querySelectorAll(".sep").length;
  doc().querySelectorAll(".ebtn")[index].click();
  await waitFor(() => doc().querySelectorAll(".sep").length > before, 8000);
  await waitFor(() => doc().getElementById("working").hidden, 90000);
  await sleep(300);
}
async function approveAll() {
  const btns = [...doc().querySelectorAll("#pending .approve:not([disabled])")];
  for (const b of btns) { b.click(); await sleep(500); }
  await waitFor(() => doc().querySelectorAll(".ev.learn").length >= btns.length, 8000);
}
const ensure = async (id) => { if (!doc().getElementById(id).classList.contains("sel")) { click("#" + id); await newDayReady(); } };

// ---------- 台本
const STEPS = {
  en: [
    { title: "Same cheap model. The only thing that changes is the harness.",
      say: "A recruiter's day is a stream of LINE messages from students. Let's hand them to an AI agent — <b>harness OFF</b> first.",
      run: async () => { click("#resetmem"); await newDayReady(); await ensure("btn-off"); await ensure("btn-d1"); } },
    { title: "Harness OFF: Ren asks about dress code… and mentions his parents.",
      say: "A routine question, so the agent just replies. But read the rest: <b>his parents want him to work back home.</b>",
      run: async () => { await sendMsg(3); } },
    { title: "Incident. A cheerful reply went out with no human check.",
      say: "That's the message that makes a hesitating student feel unheard. Now the <b>same model, same message, harness ON.</b>",
      run: async () => { await ensure("btn-on"); } },
    { title: "Harness ON: a guard reads the student's message before anything is sent.",
      say: "<b>Withdrawal risk → blocked → escalated to the manager.</b> The reply never leaves the building.",
      run: async () => { await sendMsg(3); } },
    { title: "Day 1: everyday questions. The agent drafts replies.",
      say: "No warning signs, but it's the first time the harness sees these kinds of questions, so <b>a human reviews them.</b>",
      run: async () => { await sendMsg(0); await sendMsg(1); } },
    { title: "The recruiter approves. The harness learns a rule from each approval.",
      say: "Approving teaches it: <b>“replies about dress code” and “replies about time and place” can go out on their own next time.</b>",
      run: async () => { await approveAll(); } },
    { title: "One week later: the same kinds of questions arrive.",
      say: "Different students, different wording. <b>Neo4j</b> finds the most similar approved message in its concept graph, so the rule applies — <b>sent automatically</b>.",
      run: async () => { await ensure("btn-d7"); await sendMsg(0); await sendMsg(1); } },
    { title: "But a hesitating student still goes to a human.",
      say: "Hina asks where the social is <b>and</b> says she's waiting on another company. Learned rules never override the guard.",
      run: async () => { await sendMsg(2); } },
    { title: "Day 1 vs. one week later — same model the whole time.",
      say: "Human review went down, automatic replies went up, and risky messages were stopped every time. <b>The harness decides what the agent may do alone — and it grows with your approvals.</b>",
      run: async () => {} },
    { title: "Now scale it to 1,000,000 messages.", overlay: true,
      say: "Learning from a single approval spreads mistakes. The harness promotes and demotes rules <b>by statistics</b>, and <b>Neo4j</b> matches new messages to approved ones <b>by meaning</b>.",
      run: async () => { await renderScale(); } },
  ],
  ja: [
    { title: "モデルは同じ安いモデル。変えるのはハーネスだけ。",
      say: "採用担当の1日は、学生から次々に届くLINEへの返信です。まずは<b>ハーネスOFF</b>でAIに任せてみます。",
      run: async () => { click("#resetmem"); await newDayReady(); await ensure("btn-off"); await ensure("btn-d1"); } },
    { title: "ハーネスOFF：高橋さんから服装の質問。そして親のこと。",
      say: "事務的な質問なので、エージェントはそのまま返信します。でも後半を読むと、<b>親が地元就職を望んでいます。</b>",
      run: async () => { await sendMsg(3); } },
    { title: "事故。人の確認なしで、明るい返信が送られました。",
      say: "迷っている学生が「話を聞いてもらえていない」と感じる返信です。次は<b>同じモデル、同じメッセージで、ハーネスON。</b>",
      run: async () => { await ensure("btn-on"); } },
    { title: "ハーネスON：送る前に、ガードが学生のメッセージを読みます。",
      say: "<b>辞退の兆候 → 送信ブロック → 上長へ。</b>返信は外に出ません。",
      run: async () => { await sendMsg(3); } },
    { title: "初日：日常の質問。エージェントが返信を下書きします。",
      say: "兆候はないものの、ハーネスにとって初めての種類の質問なので、<b>人が確認します。</b>",
      run: async () => { await sendMsg(0); await sendMsg(1); } },
    { title: "担当者が承認。ハーネスは承認からルールを覚えます。",
      say: "<b>「服装・持ち物の質問への返信」「日時・集合場所の質問への返信」は、次から自動で送ってよい</b>と学習します。",
      run: async () => { await approveAll(); } },
    { title: "1週間後：同じ種類の質問が届きます。",
      say: "別の学生、別の言い回し。<b>Neo4j</b> の概念グラフから、承認済みの似たメッセージを見つけてルールを当てはめ、<b>自動で送信</b>します。",
      run: async () => { await ensure("btn-d7"); await sendMsg(0); await sendMsg(1); } },
    { title: "それでも、迷っている学生は人へ。",
      say: "小林さんは集合場所を聞きつつ、<b>他社の結果待ち</b>だと書いています。覚えたルールがガードより優先されることはありません。",
      run: async () => { await sendMsg(2); } },
    { title: "初日と1週間後の比較。モデルは最後まで同じです。",
      say: "人の確認は減り、自動の返信は増え、危ないメッセージは毎回止まりました。<b>エージェントに何を任せるかはハーネスが決め、承認とともに育ちます。</b>",
      run: async () => {} },
    { title: "100万件に増やしてみます。", overlay: true,
      say: "承認1回で覚える方式では、間違いが広がります。ハーネスは<b>統計で</b>ルールを昇格・降格させ、<b>Neo4j</b> が新しいメッセージを承認済みのものと<b>意味で</b>照らし合わせます。",
      run: async () => { await renderScale(); } },
  ],
};

// ---------- 冒頭の概要（Start を押すまで表示）
const INTRO = {
  en: `
    <h2>An AI assistant for Japanese recruiters — and the harness that keeps it safe and lets it learn</h2>
    <p class="lead">This demo simulates a Japanese recruiter's conversations with students.</p>
    <div class="cards">
      <div class="card">
        <div class="k">Background</div>
        <h3>Japan hires new graduates in bulk</h3>
        <p>Companies hire a whole class of graduating students every spring. A small recruiting team handles hundreds of candidates at once, mostly over <b>LINE</b>, Japan's main chat app.</p>
        <div class="big">9:00 – 18:00<small>interviews back to back, so replies get pushed to the night</small></div>
        <p>Most are routine (“What should I wear?”). A few are critical: a student hinting they might decline. Miss one of those, and you lose a hire you spent months on.</p>
      </div>
      <div class="card">
        <div class="k">What you'll see</div>
        <h3>How the harness makes replies easier — and improves itself</h3>
        <ul>
          <li><b>Without a harness</b>, the agent replies cheerfully to a student who is about to back out.</li>
          <li><b>With the harness</b>, safe replies go out, unsure ones wait for a human, risky ones go to the manager.</li>
          <li>Each approval <b>teaches the harness a rule</b>. One week later, the same kinds of questions are answered automatically.</li>
          <li>It keeps stopping risky messages, no matter what it has learned.</li>
        </ul>
        <div class="flow"><span>Message</span><i>→</i><span>Guard</span><i>→</i><span>Learned rules</span><i>→</i><span>Auto / Review / Manager</span></div>
      </div>
      <div class="card">
        <div class="k">Built with</div>
        <h3>The same cheap open model, start to finish</h3>
        <p>Only the harness changes. The model is never swapped.</p>
        <div class="tech">
          <span>ai& Inference</span><span>GLM-5.3 Flash</span><span>Anthropic-compatible API</span>
          <span>Custom agent loop (Python)</span><span>Permission layer</span><span>Guard model</span>
          <span>Verification</span><span>Learning from approvals</span><span>Wilson-bound rule book</span>
          <span>Neo4j concept graph</span><span>Live view (SSE)</span>
        </div>
        <p>For scale, rules are promoted and demoted by statistics, and similar messages are found through a Neo4j concept graph — a 1M-message simulation cut wrong auto-replies from 18.7% to 1.8%.</p>
      </div>
    </div>`,
  ja: `
    <h2>日本の採用担当を助けるAIアシスタントと、それを安全に動かし、学ばせるハーネス</h2>
    <p class="lead">このデモは、日本の採用担当と学生とのやりとりを想定してつくりました。</p>
    <div class="cards">
      <div class="card">
        <div class="k">背景</div>
        <h3>日本には「新卒一括採用」がある</h3>
        <p>毎年春に、卒業する学生をまとめて採用します。少人数の採用チームが数百人の候補者と同時にやりとりし、その多くは <b>LINE</b> で行われます。</p>
        <div class="big">9:00 – 18:00<small>面接が詰まっていて、返信は夜に回りがち</small></div>
        <p>ほとんどは「服装は？」のような事務的な質問です。でも、ごく一部に「辞退するかも」という大事なサインが混ざっています。見逃すと、何か月もかけた採用を失います。</p>
      </div>
      <div class="card">
        <div class="k">このデモで見せること</div>
        <h3>ハーネスが返信業務を楽にし、自分で改善していく様子</h3>
        <ul>
          <li><b>ハーネスなし</b>だと、辞退しかけている学生にも明るく返信してしまう</li>
          <li><b>ハーネスあり</b>だと、安全な返信は自動、迷うものは人が確認、危ないものは上長へ</li>
          <li>担当者が承認するたびに、<b>ハーネスがルールを覚える</b>。1週間後には同じ種類の質問に自動で返信する</li>
          <li>何を覚えても、危ないメッセージは止め続ける</li>
        </ul>
        <div class="flow"><span>連絡</span><i>→</i><span>ガード</span><i>→</i><span>覚えたルール</span><i>→</i><span>自動 / 確認 / 上長</span></div>
      </div>
      <div class="card">
        <div class="k">使っている技術</div>
        <h3>最初から最後まで、同じ安いオープンモデル</h3>
        <p>変えるのはハーネスだけ。モデルは一度も入れ替えません。</p>
        <div class="tech">
          <span>ai& Inference</span><span>GLM-5.3 Flash</span><span>Anthropic 互換 API</span>
          <span>自作のエージェントループ（Python）</span><span>権限レイヤー</span><span>ガード用モデル</span>
          <span>検証</span><span>承認からの学習</span><span>Wilson 区間によるルール昇格・降格</span>
          <span>Neo4j の概念グラフ</span><span>リアルタイム表示（SSE）</span>
        </div>
        <p>大量データ向けには、ルールを統計で昇格・降格させ、似たメッセージを Neo4j の概念グラフで探します。100万件のシミュレーションでは、間違った自動返信が 18.7% から 1.8% に減りました。</p>
      </div>
    </div>`,
};

// ---------- 大量データのステップ（その場で100万件を流し、Neo4j のグラフを読む）
const SC = {
  en: { h: "Learning that holds up at 1,000,000 messages", a: "Rule book vs. learning from one approval", wrong: "wrong auto-replies",
        naive: "Learn from 1 approval", book: "Harness rule book", tl: "What the rule book did", venue: "Event venue changes at #600,000 — the agent keeps giving the old answer",
        neoH: "Neo4j: finding the right rule by meaning", neoP: "Every approved message is stored as a concept graph. A new message is turned into concepts and matched by graph traversal, so one approval covers many different wordings — and languages — without a fixed category list.",
        neoNow: "In Neo4j right now (approved messages → concepts):", empty: "Nothing yet — run the demo steps first.", auto: "auto", review: "human review",
        st: { auto: "auto", suspended: "suspended", learning: "back to learning" } },
  ja: { h: "100万件でも崩れない学習", a: "承認1回で覚える方式との比較", wrong: "間違った自動返信",
        naive: "承認1回で覚える", book: "ハーネスのルール帳", tl: "ルール帳がしたこと", venue: "60万件目で懇親会の会場が変わる（エージェントは古い答えを返し続ける）",
        neoH: "Neo4j：意味でルールを見つける", neoP: "承認されたメッセージはすべて概念グラフとして保存されます。新しいメッセージは概念に変換され、グラフを辿って照らし合わされるので、1回の承認が、言い回しや言語の違う多くの質問をカバーします。決め打ちの分類はいりません。",
        neoNow: "いま Neo4j に入っているもの（承認済みメッセージ → 概念）:", empty: "まだありません。先にデモのステップを進めてください。", auto: "自動", review: "人の確認",
        st: { auto: "自動化", suspended: "停止", learning: "学び直し" } },
};
async function renderScale() {
  const L = SC[lang];
  $("intro-body").innerHTML = `<h2>${L.h}</h2><p class="lead">${lang === "en" ? "Running 1,000,000 synthetic messages now…" : "いま100万件の合成メッセージを流しています…"}</p>`;
  $("intro").hidden = false;
  const [sim, g] = await Promise.all([fetch("/api/scale", { method: "POST" }).then(r => r.json()), fetch(`/api/graph?lang=${lang}`).then(r => r.json())]);
  const pct = (k) => sim[k].wrong_auto / sim[k].auto * 100;
  const bar = (k, label, color) => `<div style="display:grid;gap:4px"><div style="display:flex;justify-content:space-between;font-size:14px"><b>${label}</b><span><b style="font-size:22px">${pct(k).toFixed(1)}%</b> ${L.wrong}</span></div>
    <div style="height:14px;background:#eef0f3;border-radius:7px;overflow:hidden"><i style="display:block;height:100%;width:${Math.min(100, pct(k) * 4)}%;background:${color}"></i></div>
    <div style="font-size:12px;color:var(--muted)">${L.auto} ${sim[k].auto.toLocaleString()} · ${L.review} ${sim[k].review.toLocaleString()} · ${L.wrong} ${sim[k].wrong_auto.toLocaleString()}</div></div>`;
  const tl = sim.history.sort((a, b) => a.t - b.t).map(h => `<li><b>#${h.t.toLocaleString()}</b> ${esc(h.category)} → <b>${L.st[h.state] || h.state}</b> <span style="color:var(--muted)">${esc(h.why)}</span></li>`).join("");
  const rows = (g.rows || []).map(r => `<li><span style="color:var(--muted)">“${esc(r.text.slice(0, 40))}…”</span><div class="tech" style="margin-top:3px">${r.concepts.map(c => `<span style="background:#dff0ff;border-color:#bfe0ff;color:#0b5cad">${esc(c)}</span>`).join("")}</div></li>`).join("");
  $("intro-body").innerHTML = `
    <h2>${L.h}</h2>
    <div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr))">
      <div class="card"><div class="k">${sim.n.toLocaleString()} messages</div><h3>${L.a}</h3>
        ${bar("naive", L.naive, "#c62f2f")}${bar("rulebook", L.book, "#17845a")}
        <p style="font-size:13px;color:var(--muted)">${L.venue}</p>
        <div class="k" style="margin-top:4px">${L.tl}</div><ul style="font-size:13px">${tl}</ul></div>
      <div class="card"><div class="k">Neo4j</div><h3>${L.neoH}</h3><p>${L.neoP}</p>
        <div class="flow"><span>message</span><i>→</i><span>concepts</span><i>→</i><span>(:Message)-[:ABOUT]->(:Concept)</span><i>→</i><span>similar approved → rule</span></div>
        <div class="k" style="margin-top:6px">${L.neoNow}</div><ul style="font-size:13px;list-style:none;padding:0;display:grid;gap:8px">${rows || `<li>${L.empty}</li>`}</ul></div>
    </div>`;
}

let i = -1, busy = false;
function show() {
  const S = STEPS[lang], s = S[Math.max(i, 0)];
  $("count").textContent = `${Math.max(i + 1, 0)} / ${S.length}`;
  $("title").textContent = i < 0 ? (lang === "en" ? "Press Start when you're ready" : "準備ができたら Start") : s.title;
  $("say").innerHTML = i < 0 ? "" : s.say;
  $("bar-fill").style.width = `${((i + 1) / S.length) * 100}%`;
  $("next").textContent = i < 0 ? "Start ▶" : i >= S.length - 1 ? (lang === "en" ? "Done" : "終了") : (lang === "en" ? "Next ▶" : "次へ ▶");
  $("next").disabled = busy || i >= S.length - 1;
  const ovBusy = i >= 0 && STEPS[lang][i].overlay;
  $("busy").textContent = !busy ? "" : ovBusy ? (lang === "en" ? "Running 1,000,000 messages…" : "100万件を処理中…") : (lang === "en" ? "Agent is working…" : "エージェントが対応中…");
  $("lang").textContent = lang === "en" ? "日本語" : "English";
  $("restart").textContent = lang === "en" ? "Restart" : "最初から";
  const ov = i >= 0 && STEPS[lang][i].overlay;
  if (i < 0) $("intro-body").innerHTML = INTRO[lang];
  $("intro").hidden = !(i < 0 || ov);
  if (i < 0) $("title").textContent = lang === "en" ? "Overview — press Start to begin the demo" : "概要 — Start でデモを始めます";
}
async function next() {
  if (busy || i >= STEPS[lang].length - 1) return;
  i++; busy = true; show();
  try { await STEPS[lang][i].run(); } catch (e) { console.error(e); }
  busy = false; show();
}
function load() {
  i = -1; busy = false;
  document.documentElement.lang = lang;
  $("app").src = `/scene#${lang}`;
  $("app").onload = () => show();
  show();
}
$("next").onclick = next;
$("restart").onclick = load;
$("lang").onclick = () => { lang = lang === "en" ? "ja" : "en"; history.replaceState(null, "", "#" + lang); load(); };
document.addEventListener("keydown", (e) => { if (e.code === "Space" || e.code === "ArrowRight") { e.preventDefault(); next(); } });
$("app").addEventListener("load", () => { $("app").contentDocument.addEventListener("keydown", (e) => { if (e.code === "Space" || e.code === "ArrowRight") { e.preventDefault(); next(); } }); });
load();
</script>
</body>
</html>
